spring.cloud.discovery.enabled=true
server.port=8082

# --- PostgreSQL Database Configuration ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:inventory-db}:5432/${DB_NAME:inventory_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# --- Keycloak OAuth2 Resource Server ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://keycloak:8080/realms/microservices-realm}
eureka.client.serviceUrl.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka/
